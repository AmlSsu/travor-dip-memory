services:
  memory:
    build: .
    image: context-weave:0.28.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18092:8000"
    volumes:
      - memory-v280:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  memory-v280:
